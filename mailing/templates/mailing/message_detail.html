{% extends 'catalog/base.html' %}

{% block content %}

<div class="container">

    <h1>{{ object.subject }}</h1>

    <p>
        <strong>Текст письма:</strong>
    </p>

    <p>
        {{ object.body }}
    </p>

    <a href="{% url 'mailing:message_update' object.pk %}"
       class="btn btn-warning">
        Редактировать
    </a>

    <a href="{% url 'mailing:message_delete' object.pk %}"
       class="btn btn-danger">
        Удалить
    </a>

</div>

{% endblock %}
