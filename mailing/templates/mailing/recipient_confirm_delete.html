{% extends 'catalog/base.html' %}

{% block content %}

<div class="container">

    <h1>Удаление получателя</h1>

    <p>
        Вы уверены, что хотите удалить
        "{{ object.full_name }}"?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit"
                class="btn btn-danger">
            Удалить
        </button>

    </form>

</div>

{% endblock %}
