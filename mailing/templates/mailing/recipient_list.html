{% extends 'catalog/base.html' %}

{% block content %}

<div class="container">

    <div class="row mb-3">
        <div class="col">
            <h1>Получатели рассылки</h1>
        </div>

        <div class="col text-end">
            <a href="{% url 'mailing:recipient_create' %}"
               class="btn btn-primary">
                Добавить получателя
            </a>
        </div>
    </div>

    <form method="get"
          class="mb-4">

        <div class="input-group">

            <input type="text"
                   name="q"
                   value="{{ request.GET.q }}"
                   placeholder="Поиск по email"
                   class="form-control">

            <button type="submit"
                    class="btn btn-outline-primary">
                Найти
            </button>

            <a href="{% url 'mailing:recipient_list' %}"
               class="btn btn-outline-secondary">
                Сбросить
            </a>

        </div>

    </form>

    <div class="row">

        {% for recipient in object_list %}

            <div class="col-md-4 mb-3">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            {{ recipient.full_name }}
                        </h5>

                        <p>
                            {{ recipient.email }}
                        </p>

                        <a href="{% url 'mailing:recipient_detail' recipient.pk %}"
                           class="btn btn-sm btn-outline-primary">
                            Подробнее
                        </a>

                    </div>

                </div>

            </div>

        {% empty %}

            <p>Получателей пока нет.</p>

        {% endfor %}

    </div>

</div>

{% endblock %}
