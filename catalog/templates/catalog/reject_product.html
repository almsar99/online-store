{% extends 'catalog/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6 mx-auto">

            <div class="card">

                <div class="card-header">
                    Снять продукт с публикации
                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit"
                                class="btn btn-danger">
                            Снять с публикации
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
