<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Skystore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom">

    <h5 class="my-0 mr-md-auto font-weight-normal">
        Skystore
    </h5>

    <nav class="ms-5">

        <a class="p-2 btn btn-outline-primary"
           href="/">
            Каталог
        </a>

        <a class="p-2 btn btn-outline-primary"
           href="/contacts/">
            Контакты
        </a>

    </nav>

</div>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">

    <h1 class="display-4">
        Skystore
    </h1>

    <p class="lead">
        Skystore — отличный вариант хранения ваших продуктов.
    </p>

</div>

<div class="container">

    <div class="row text-center">

        <div class="col-3">

            <div class="card mb-4 box-shadow">

                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">
                        Telegram бот
                    </h4>
                </div>

                <div class="card-body">

                    <h1 class="card-title pricing-card-title">
                        $100
                    </h1>

                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">

                        <li>Поддержка</li>
                        <li>Обновления</li>
                        <li>Установка</li>

                    </ul>

                    <button type="button"
                            class="btn btn-lg btn-block btn-outline-primary">
                        Купить
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
