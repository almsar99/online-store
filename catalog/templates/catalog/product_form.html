{% extends 'base.html' %}

{% block title %}
Добавление продукта
{% endblock %}

{% block content %}

<div class="col-6 mx-auto">

    <div class="card">

        <div class="card-header">
            <h3>Добавление продукта</h3>
        </div>

        <div class="card-body">

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-outline-primary">
                    Сохранить
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
