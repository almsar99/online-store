<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Online Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Online Store</a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">Главная</a>
            <a class="nav-link" href="/contacts/">Контакты</a>
            <a class="nav-link" href="/blogs/">Блоги</a>

            {% if user.is_authenticated %}
                <a class="nav-link" href="/mailing/">Рассылки</a>

                {% if user.is_staff or perms.users.can_view_all_users %}
                    <a class="nav-link" href="/users/users/">Пользователи</a>
                {% endif %}

                <a class="nav-link" href="/users/profile/">Профиль</a>
                <form method="post"
                      action="/users/logout/"
                      class="d-inline">

                    {% csrf_token %}

                    <button type="submit"
                            class="nav-link btn btn-link text-light p-0">
                        Выход
                    </button>

                </form>
            {% else %}
                <a class="nav-link" href="/users/login/">Вход</a>
                <a class="nav-link" href="/users/register/">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}

</body>
</html>
