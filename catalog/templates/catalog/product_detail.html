{% extends 'base.html' %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-6">

        {% if product.image %}
        <img src="{{ product.image.url }}"
             class="img-fluid">
        {% endif %}

    </div>

    <div class="col-6">

        <h1>{{ product.name }}</h1>

        <p class="mt-4">
            {{ product.description }}
        </p>

        <h3 class="mt-4">
            {{ product.price }} ₽
        </h3>

        <a href="/"
           class="btn btn-outline-primary mt-3">
            Назад
        </a>

    </div>

</div>

{% endblock %}
