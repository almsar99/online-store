<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Контакты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom">

    <h5 class="my-0 mr-md-auto font-weight-normal">
        Skystore
    </h5>

    <nav class="ms-5">

        <a class="p-2 btn btn-outline-primary"
           href="/">
            Каталог
        </a>

        <a class="p-2 btn btn-outline-primary"
           href="/contacts/">
            Контакты
        </a>

    </nav>

</div>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">

    <h1 class="display-4">
        Контакты
    </h1>

</div>

<div class="container">

    <div class="row text-start">

        <div class="col-lg-9 col-md-6 col-sm-12">

            <div class="card mb-4 box-shadow">

                <div class="card-body">

                    <table class="table table-striped">

                        <tr>
                            <td class="w-25">Страна</td>
                            <td>Germany</td>
                        </tr>

                        <tr>
                            <td class="w-25">Город</td>
                            <td>Frankfurt</td>
                        </tr>

                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>Main Street 1</td>
                        </tr>

                    </table>

                </div>

            </div>

        </div>

        <div class="col-lg-3 col-md-6 col-sm-12">

            <div class="card mb-4 box-shadow">

                <div class="card-header">

                    <h4 class="my-0 font-weight-normal">
                        Свяжитесь с нами
                    </h4>

                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label for="name">
                                Имя
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   id="name"
                                   placeholder="Ваше имя"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="phone">
                                Телефон
                            </label>

                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   id="phone"
                                   placeholder="Телефон"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="message">
                                Сообщение
                            </label>

                            <textarea name="message"
                                      class="form-control"
                                      id="message"
                                      required></textarea>

                        </div>

                        <button type="submit"
                                class="btn btn-lg btn-outline-primary">
                            Отправить
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
