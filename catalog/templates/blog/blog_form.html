{% extends 'base.html' %}

{% block title %}
Форма статьи
{% endblock %}

{% block content %}

<div class="col-6 mx-auto">

    <div class="card">

        <div class="card-header">

            <h3>
                Создание/редактирование статьи
            </h3>

        </div>

        <div class="card-body">

            <form method="post"
                  enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-outline-primary">
                    Сохранить
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
