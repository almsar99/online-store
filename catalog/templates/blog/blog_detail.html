{% extends 'base.html' %}

{% block title %}
{{ object.title }}
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-12">

        <div class="card mb-4">

            {% if object.preview %}
            <img src="{{ object.preview.url }}"
                 class="card-img-top">
            {% endif %}

            <div class="card-body">

                <h1>
                    {{ object.title }}
                </h1>

                <p>
                    {{ object.content }}
                </p>

                <p>
                    Просмотров: {{ object.views_count }}
                </p>

                <a href="{% url 'blog:update' object.pk %}"
                   class="btn btn-outline-warning">
                    Редактировать
                </a>

                <a href="{% url 'blog:delete' object.pk %}"
                   class="btn btn-outline-danger">
                    Удалить
                </a>

                <a href="{% url 'blog:list' %}"
                   class="btn btn-outline-primary">
                    Назад
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
