{% extends 'base.html' %}

{% block title %}
Профиль
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-md-6 mx-auto">

        <div class="card shadow-sm">

            <div class="card-header">

                <h3>
                    Профиль пользователя
                </h3>

            </div>

            <div class="card-body">

                <form method="post" enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        Сохранить

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
