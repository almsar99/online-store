{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h3 class="text-center">
                        Восстановление пароля
                    </h3>
                </div>

                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Отправить
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </div>
</div>
{% endblock %}
